<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org — Content, Enterprise, Brand, Loopy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07141c; --text:#e8f2f6; --muted:#8ea6b3; --gold:#e4b86a; --gold-dim:rgba(228,184,106,.22);
  --blue:#1f6bff; --glass:rgba(8,22,32,.74); --hair:rgba(196,220,232,.14);
  --ui:'Schibsted Grotesk',system-ui,sans-serif; --serif:'Fraunces',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.65,0,.2,1); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--text);font:14px/1.45 var(--ui);
  background:
    radial-gradient(900px 560px at 40% 46%, rgba(28,72,104,.42), transparent 68%),
    radial-gradient(640px 420px at 62% 18%, rgba(228,184,106,.07), transparent 70%),
    linear-gradient(180deg,#061018 0%, #0b1e2c 48%, #07141c 100%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#stars,.vig,#field{position:absolute;inset:0}
#stars{width:100%;height:100%;z-index:0}
.vig{z-index:1;pointer-events:none;background:radial-gradient(68% 62% at 40% 46%, transparent 42%, rgba(4,10,16,.62) 100%)}
#field{z-index:2;width:100%;height:100%;touch-action:none;cursor:grab}
#field.drag{cursor:grabbing}
.ui{position:absolute;inset:0;z-index:3;pointer-events:none}
.ui button,.ui input,.ui a,.modes,.side,.time,.caption,.top .ask,.crumb,.chip{pointer-events:auto}
.top{display:flex;align-items:flex-start;gap:18px;padding:16px 22px 0}
.word{background:none;border:0;text-align:left;padding:0}
.word strong{display:block;font-family:var(--serif);font-size:32px;font-weight:500;letter-spacing:-.03em;line-height:.9}
.word em{display:block;margin-top:5px;font-style:normal;font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:6px;margin-top:10px;overflow:auto;white-space:nowrap;color:var(--muted);font-size:13px}
.crumb button{background:none;border:0;padding:4px 0;color:var(--muted)}
.crumb button:last-of-type,.crumb span.name{color:var(--text);font-weight:600}
.sep{opacity:.45}
.chip{margin-top:6px;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--gold-dim);background:var(--glass);backdrop-filter:blur(12px);display:flex;align-items:center;gap:8px;white-space:nowrap}
.chip small{font:500 10px var(--mono);color:var(--gold);letter-spacing:.08em}
.ask{position:relative;width:min(320px,32vw);margin-top:2px}
.ask input{width:100%;height:42px;border-radius:21px;border:1px solid var(--gold-dim);background:var(--glass);backdrop-filter:blur(12px);padding:0 46px 0 14px}
.ask input::placeholder{color:var(--muted)}
.ask button{position:absolute;right:4px;top:4px;width:34px;height:34px;border:0;border-radius:50%;background:var(--blue);color:#fff}
.modes{position:absolute;left:18px;top:96px;width:210px;display:flex;flex-direction:column;gap:2px}
.mode{display:grid;grid-template-columns:32px 1fr;gap:8px;text-align:left;background:transparent;border:0;border-left:2px solid transparent;padding:8px 10px;color:var(--muted);border-radius:0 8px 8px 0}
.mode b{font:500 11px var(--mono);color:var(--gold)}
.mode span{display:block;color:var(--text);font-weight:550;font-size:13.5px}
.mode.on{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(228,184,106,.14),transparent)}
.legend{margin:14px 0 0 12px;display:grid;gap:5px;color:var(--muted);font:11px var(--mono)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.open-loop{margin:12px 0 0 12px;pointer-events:auto}
.side{position:absolute;right:18px;top:96px;bottom:16px;width:344px;overflow:auto;padding-right:4px}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:rgba(228,184,106,.28);border-radius:8px}
.card{background:var(--glass);border:1px solid var(--gold-dim);border-radius:16px;backdrop-filter:blur(18px) saturate(1.15);box-shadow:0 18px 50px rgba(0,0,0,.28);padding:14px 14px 12px;margin-bottom:10px}
.eyebrow{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.card h2{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:-.03em;line-height:1.08;margin:6px 0 8px}
.card p{margin:0;color:#d5e3ea;font-size:13.5px}
.principles{list-style:none;margin:12px 0 0;padding:0}
.principles li{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--gold-dim);font-size:13px;line-height:1.4}
.principles b{font:500 10px var(--mono);color:var(--gold);padding-top:3px}
.enters,.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--gold-dim);background:rgba(255,255,255,.04);font-size:13px;font-weight:550}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--gold-dim);border-radius:10px;overflow:hidden;margin-top:10px}
.metrics div{background:rgba(6,16,24,.78);padding:8px 10px}
.metrics small{display:block;font:500 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.metrics b{font:500 16px var(--mono);font-variant-numeric:tabular-nums}
.links{margin-top:10px}
.linkrow{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--hair);padding:8px 0;font-size:13px}
.linkrow span{color:var(--muted);font-size:12px;text-align:right}
.switch{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.switch button{height:26px;padding:0 8px;border-radius:99px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--muted);font-size:11px;font-weight:600}
.switch button.on{background:#fff;color:#102033;border-color:#fff}
.quote{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.32;margin:10px 0 8px}
.next{font-size:12.5px;color:var(--muted);margin-top:6px}
.next b{color:var(--text);font-weight:600}
.foot{margin-top:8px;color:var(--muted);font-size:11px}
.caption{position:absolute;left:22px;bottom:96px;width:min(520px, calc(100vw - 430px));color:var(--muted);font-size:13px}
.caption b{color:var(--text);font-weight:600}
.time{position:absolute;left:18px;right:380px;bottom:12px;display:flex;flex-direction:column;gap:6px;padding:8px 12px 8px;border-radius:14px;background:var(--glass);border:1px solid var(--gold-dim);backdrop-filter:blur(16px)}
.time-top{display:flex;align-items:center;gap:10px;min-width:0}
#when{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.evs{display:flex;gap:6px;overflow:auto;min-width:0}
.evs button{border:1px solid var(--hair);background:rgba(255,255,255,.03);color:var(--muted);border-radius:99px;height:26px;padding:0 10px;white-space:nowrap;font-size:12px}
.evs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.months{display:grid;grid-template-columns:repeat(12,1fr);cursor:ew-resize}
.months button{background:none;border:0;border-left:1px solid rgba(207,224,236,.22);color:var(--muted);text-align:left;padding:3px 0 0 5px;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.months button small{display:block;font:9px var(--mono);letter-spacing:0;text-transform:none;opacity:.6}
.months button.on{color:#fff;font-weight:700;box-shadow:inset 0 3px 0 var(--blue)}
.months .dot{display:block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin:0 0 3px 2px}
.quiet{color:var(--muted);font-size:12px;white-space:nowrap}
.sub{font:600 11px var(--ui);fill:#3d2912}
.node{cursor:pointer}
.label{font:500 13px var(--ui);fill:#e8f2f6}
.label.core{font-family:var(--serif);font-size:26px;font-weight:500}
.pct{fill:#e4b86a;font-family:var(--mono);font-size:11px}
.mark{font:500 11px var(--mono);fill:#f4fbff}
.edge{fill:none}
.tag{cursor:pointer}
.tag rect{fill:rgba(8,22,32,.8);stroke:rgba(196,181,253,.7)}
.tag text{fill:#ddd4ff;font:500 11px var(--ui);text-anchor:middle}
.orbit{fill:none;stroke:rgba(196,181,253,.55);stroke-width:1.15;stroke-dasharray:2 8;animation:drift 90s linear infinite}
.primering{fill:none;stroke:rgba(228,184,106,.45);stroke-width:1.2}
@keyframes drift{to{stroke-dashoffset:-240}}
.boom{position:absolute;z-index:9;left:12px;top:12px;right:12px;background:#3a1016;color:#ffd0d6;padding:12px;border-radius:8px;white-space:pre-wrap}
@media (max-width:860px){
  .top{padding:10px 10px 0;gap:8px}
  .word em{display:none}
  .word strong{font-size:26px}
  .modes{left:8px;right:8px;top:50px;width:auto;flex-direction:row;overflow:auto;gap:0;z-index:5;background:rgba(7,20,28,.92);border:1px solid var(--gold-dim);border-radius:12px;padding:4px}
  .mode{display:flex;align-items:center;flex:none;width:max-content;padding:6px 10px;border-left:0;border-bottom:2px solid transparent;border-radius:8px}
  .mode span{font-size:12px;white-space:nowrap}
  .mode b{display:none}
  .mode.on{border-bottom-color:var(--gold)}
  .legend,.caption,.open-loop{display:none}
  .side{left:8px;right:8px;top:auto;width:auto;height:34vh;bottom:8px}
  .time{left:8px;right:8px;bottom:calc(34vh + 12px)}
  .ask{width:42px}.ask input{padding:0;color:transparent}.ask input::placeholder{color:transparent}
  .crumb{display:none}
  .chip small{display:none}
  .card h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  .orbit{animation:none}
  *{transition:none!important}
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="vig" aria-hidden="true"></div>
<svg id="field" role="application" aria-label="Consent constellation. Content, Enterprise, Brand, and Loopy.">
  <defs>
    <radialGradient id="coreg" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fff6df"/>
      <stop offset="38%" stop-color="#e4b86a"/>
      <stop offset="78%" stop-color="#8a6230"/>
      <stop offset="100%" stop-color="#8a6230" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="world">
    <circle id="orbit" class="orbit" r="148"/>
    <g id="loopyTag" class="tag" role="button" tabindex="0" aria-label="Open Loopy" style="display:none">
      <rect x="-58" y="-13" width="116" height="26" rx="13"/>
      <text y="4">Loopy governs</text>
    </g>
    <g id="edges"></g>
    <g id="nodes"></g>
  </g>
</svg>
<div class="ui">
  <header class="top">
    <button class="word" type="button" data-act="home" aria-label="Back to the consent center">
      <strong>Org</strong>
      <em>Content · Enterprise · Brand · Loopy</em>
    </button>
    <nav class="crumb" id="crumb" aria-label="Org path"></nav>
    <button class="chip" type="button" id="agentChip" data-act="cycle" aria-label="Cycle Loopy agent"></button>
    <form class="ask" id="askForm">
      <input id="askIn" type="text" placeholder="Ask the org" aria-label="Ask the org" autocomplete="off">
      <button type="submit" aria-label="Ask">↵</button>
    </form>
  </header>
  <nav class="modes" aria-label="Ways to read the org">
    <button class="mode" type="button" data-mode="event"><b>01</b><span>Event insights</span></button>
    <button class="mode" type="button" data-mode="heat"><b>02</b><span>Network heatmap</span></button>
    <button class="mode" type="button" data-mode="diag"><b>03</b><span>Zoomed diagnostics</span></button>
    <button class="mode on" type="button" data-mode="depth"><b>04</b><span>Sub-levels</span></button>
    <button class="mode" type="button" data-mode="follow"><b>05</b><span>Follow a change</span></button>
    <div class="legend" aria-hidden="true">
      <div><i style="background:#e4b86a"></i>Consent · primacy</div>
      <div><i style="background:#c4b5fd"></i>Loopy · the ring</div>
      <div><i style="background:#3ec8db"></i>Content</div>
      <div><i style="background:#4c8dff"></i>Enterprise</div>
      <div><i style="background:#ff6fae"></i>Brand</div>
      <div><i style="background:#f0b429"></i>Identity, channel, signal</div>
    </div>
    <button class="btn open-loop" type="button" data-go="loopy" data-dive="1">Open the Loopy ring</button>
  </nav>
  <aside class="side" id="side" aria-live="polite">
    <section class="card" id="metrics"></section>
    <section class="card" id="detail"></section>
    <section class="card" id="loopy"></section>
  </aside>
  <p class="caption" id="caption"></p>
  <footer class="time" id="time">
    <div class="time-top"><span id="when"></span><div class="evs" id="evs"></div></div>
    <div class="months" id="months" role="slider" aria-valuemin="0" aria-valuemax="11" aria-label="Month"></div>
  </footer>
</div>

function kidsOf(id){
  if (id==='consent') return KIDS.consent.concat(['loopy']);

function pathFromRoot(id){
  if (id==='consent') return ['consent'];
  const q = [['consent']];
  const seen = new Set(['consent']);
  while (q.length){
    const path = q.shift();
    for (const k of kidsOf(path[path.length-1])){
      if (seen.has(k)) continue;
      const next = path.concat(k);
      if (k===id) return next;
      seen.add(k);
      q.push(next);
    }
  }
  return null;
}

function ghostAngles(items, count){
  const angs = items.map(i => i.deg).filter(d => typeof d==='number').map(norm).sort((a,b)=>a-b);
  if (!angs.length) return Array.from({length:count}, (_,i) => -90 + i*360/count);
  const gaps = [];
  for (let i=0;i<angs.length;i++){
    const a = angs[i];
    const b = i+1===angs.length ? angs[0]+360 : angs[i+1];
    gaps.push({a, span:b-a});
  }
  gaps.sort((x,y)=>y.span-x.span);
  const total = gaps.reduce((s,g)=>s+g.span,0) || 1;
  let left = count;
  const spots = [];
  gaps.forEach((g,gi) => {
    if (!left) return;
    if (g.span < 26 && spots.length) return;
    let n = gi===gaps.length-1 ? left : Math.max(1, Math.round(count * g.span / total));

    [/lotus/, 'lotus'],
    [/rajesh|director/, 'rajesh'],
    [/andheri|address farm|\bfarm\b/, 'andheri'],
    [/money\s?grow/, 'mgrow'],
    [/finco|clean anchor/, 'finco'],
    [/consent gap|coverage/, 'sig-consent'],
    [/orion|pause/, 'orion'],
    [/nova/, 'nova'], [/vega|next step/, 'vega'], [/echo|remember/, 'echo'], [/atlas/, 'atlas'],
    [/halcyon mobile|look-?alike/, 'b-hmob'],
    [/halcyon/, 'halcyon'],
    [/quick\s?credit/, 'qcredit'],
    [/pan|bbacg|aaacf/, 'pan2'],
    [/header/, 'hdr-bad'],
    [/loopy|the ring/, 'loopy'],
    [/^content$/, 'content'], [/enterprise/, 'enterprise'], [/^brand$/, 'brand'],
    [/enforcement|blocklist/, 'enforcement'], [/channel|sender/, 'channel'], [/identity/, 'identity'],
    [/signal|complaint/, 'signal']
  ];
  if (/^consent$|back to the cent/.test(s)){
    S.stack=['consent']; S.sel='consent'; S.miss=false; userMoved=false; commit(); return;
  }
  let id = null;
  for (const [re, dest] of rules) if (re.test(s)){ id = dest; break; }
  if (!id || !N[id]){ S.miss = true; paint(); return; }
  S.miss = false;
  if (/fingerprint|reuse|yono|director|farm|hijack|still sending/.test(s)) S.mode = 'diag';
  focusPlaced(id);
}

document.body.addEventListener('click', ev => {
  const mode = ev.target.closest('[data-mode]');
  if (mode){ setMode(mode.dataset.mode); return; }
  const agent = ev.target.closest('[data-agent]');
  if (agent){ S.agent = agent.dataset.agent; paint(); return; }
  const crumb = ev.target.closest('[data-crumb]');
  if (crumb){
    const i = +crumb.dataset.crumb;
    S.stack = S.stack.slice(0, i+1);
    S.sel = S.stack[S.stack.length-1];
    userMoved = false;
    commit();
    return;
  }
  const month = ev.target.closest('[data-month]');
  if (month){ setMonth(+month.dataset.month); return; }
  const evb = ev.target.closest('[data-ev]');
  if (evb){
    const item = EVENTS.find(x => x.id===evb.dataset.ev);
    S.follow = item.id; S.mode = 'follow'; S.month = Math.max(S.month, item.m);
    focusPlaced(item.focus);
    return;
  }
  const go = ev.target.closest('[data-go]');
  if (go){
    const id = go.dataset.go;
    if (go.dataset.dive==='1'){
      const path = pathFromRoot(id);
      if (path){
        S.stack = kidsOf(id).length ? path : path.slice(0,-1);
        if (!S.stack.length) S.stack=['consent'];
        S.sel = id; S.miss=false; userMoved=false; commit();
      }
    } else {
      S.miss = false;
      if (S.mode==='depth') S.mode = 'diag';
      focusPlaced(id);
    }
    return;
  }
  const act = ev.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act==='home'){ S.stack=['consent']; S.sel='consent'; S.mode='depth'; S.miss=false; userMoved=false; commit(); }
  if (act.dataset.act==='back') back();
  if (act.dataset.act==='dive') onNode(S.sel, true);
  if (act.dataset.act==='place') focusPlaced(S.sel);
  if (act.dataset.act==='cycle'){
    const order = ['auto','nova','atlas','vega','echo','orion'];
    S.agent = order[(order.indexOf(S.agent)+1) % order.length];
    paint();
  }
});
$('#askForm').addEventListener('submit', ev => { ev.preventDefault(); ask($('#askIn').value); });
loopyTag.addEventListener('click', ev => {
  ev.stopPropagation();
  S.stack = ['consent','loopy']; S.sel = 'loopy'; userMoved = false; commit();
});
loopyTag.addEventListener('keydown', ev => { if (ev.key==='Enter') loopyTag.click(); });

let drag = null, movedPx = 0, scrub = false;
field.addEventListener('pointerdown', ev => {
  if (ev.target.closest('.node') || ev.target.closest('#loopyTag')) return;
  drag = {x:ev.clientX, y:ev.clientY, cx:cam.x, cy:cam.y};
  movedPx = 0;
  field.classList.add('drag');
  field.setPointerCapture(ev.pointerId);
});
field.addEventListener('pointermove', ev => {
  if (!drag) return;
  const dx = ev.clientX-drag.x, dy = ev.clientY-drag.y;
  movedPx += Math.abs(dx)+Math.abs(dy);
  cam.x = cam.tx = drag.cx + dx;
  cam.y = cam.ty = drag.cy + dy;
  userMoved = true;
  applyCam();
});
field.addEventListener('pointerup', () => { drag=null; field.classList.remove('drag'); });
field.addEventListener('click', ev => {
  if (movedPx>5) return;
  if (ev.target.closest('.node') || ev.target.closest('#loopyTag')) return;
  if (S.sel!==S.stack[S.stack.length-1]){ S.sel = S.stack[S.stack.length-1]; commit(); }
});
field.addEventListener('wheel', ev => {
  ev.preventDefault();
  const k = clamp(cam.k * (ev.deltaY>0 ? 0.92 : 1.08), 0.25, 3.2);
  const rect = field.getBoundingClientRect();
  const mx = ev.clientX-rect.left, my = ev.clientY-rect.top;
  const wx = (mx-cam.x)/cam.k, wy = (my-cam.y)/cam.k;
  cam.k = cam.tk = k;
  cam.x = cam.tx = mx - wx*k;
  cam.y = cam.ty = my - wy*k;
  userMoved = true;
  applyCam();
}, {passive:false});
window.addEventListener('keydown', ev => {
  if (ev.target.matches('input,textarea')){ if (ev.key==='Escape') ev.target.blur(); return; }
  if (ev.key==='Escape') back();
  if (ev.key==='Enter') onNode(S.sel, true);
  if (ev.key==='/'){ ev.preventDefault(); $('#askIn').focus(); }
  if (ev.key>='1' && ev.key<='5') setMode(['event','heat','diag','depth','follow'][ev.key-1]);
});
window.addEventListener('resize', () => { if (!userMoved){ booted = true; fit(layoutItems(), false); kick(); } else applyCam(); drawStars(); });

const months = $('#months');
months.innerHTML = MONTHS.map((m,i) => {
  const dot = EVENTS.some(e => e.m===i) ? '<i class="dot"></i>' : '<i class="dot" style="opacity:0"></i>';
  return `<button type="button" data-month="${i}">${dot}<b>${m}</b><small>${YEARS[i]}</small></button>`;
}).join('');
months.addEventListener('pointerdown', ev => { scrub = true; });
window.addEventListener('pointermove', ev => {
  if (!scrub) return;
  const r = months.getBoundingClientRect();
  setMonth(Math.floor((ev.clientX-r.left)/r.width*12));
});
window.addEventListener('pointerup', () => { scrub = false; });

function drawStars(){
  const c = $('#stars'), dpr = Math.min(devicePixelRatio||1, 2);
  c.width = innerWidth*dpr; c.height = innerHeight*dpr;
  const g = c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,innerWidth,innerHeight);
  STAR.forEach(s => {
    g.globalAlpha = s.a;
    g.fillStyle = s.gold ? '#e4b86a' : '#d5e4ee';
    g.beginPath();
    g.arc(s.x*innerWidth, s.y*innerHeight, s.r, 0, 6.3);
    g.fill();
  });
}
const STAR = Array.from({length:150}, (_,i) => {
  const n = Math.sin(i*997)*10000, r = n-Math.floor(n);
  const n2 = Math.sin(i*613)*10000, r2 = n2-Math.floor(n2);
  const n3 = Math.sin(i*241)*10000, r3 = n3-Math.floor(n3);
  return {x:r, y:r2, r:r3*1.3+0.3, a:0.15+r*0.55, gold:r3>0.92};
});
drawStars();

const bad = [];
Object.entries(KIDS).forEach(([p, kids]) => {
  if (!N[p]) bad.push('missing parent '+p);
  kids.forEach(k => { if (!N[k]) bad.push('missing child '+p+' → '+k); });
});
Object.values(N).forEach(n => (n.links||[]).forEach(l => { if (!N[l.to]) bad.push('missing link '+n.id+' → '+l.to); }));
if (bad.length){
  const pre = document.createElement('pre');
  pre.className = 'boom';
  pre.textContent = bad.join('\n');
  document.body.appendChild(pre);
}
commit();
})();
</script>
</body>
