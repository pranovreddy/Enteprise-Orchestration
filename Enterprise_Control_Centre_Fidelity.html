<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enterprise Control Centre · Fidelity</title>
<style>
:root{
  --ink:#172033; --muted:#5c6b7c; --line:#e4ebf3; --blue:#2f6bff; --blue-2:#1d4ed8;
  --crit:#e23d4a; --warn:#e0922f; --ok:#1f8a4c; --bg:#eef3f8;
  --ins:400px; --top:60px;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter, "Segoe UI", system-ui, sans-serif;
  color:var(--ink); background:
    radial-gradient(900px 520px at 12% -10%, #fff 0%, transparent 55%),
    linear-gradient(180deg,#f7f9fb 0%, #e7eef5 100%);
  overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage .face{stroke-width:1.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#stage .grid,#stage .route,#stage .route-glow,#stage .link,#stage text,#stage .shade{pointer-events:none}
#stage .grid{stroke:#e6eef5;stroke-width:1px;vector-effect:non-scaling-stroke}
#stage .shade{fill:rgba(48,70,100,.22)}
#stage .route{fill:none;stroke:#2f6bff;stroke-width:2.4px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:7 9;animation:march .9s linear infinite}
#stage .route-glow{fill:none;stroke:#2f6bff;stroke-width:8px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.16}
#stage .link{fill:none;stroke:#f08a24;stroke-width:1.7px;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:5 7}
#stage text{font-family:Inter,sans-serif}
#stage .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){#stage .route{animation:none}}

#top{
  position:fixed;top:0;left:0;right:0;height:var(--top);z-index:30;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(23,32,51,.06);
}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left}
.mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;background:linear-gradient(145deg,#3d7bff,#1d4ed8);box-shadow:0 6px 14px rgba(47,107,255,.28)}
.logo b{display:block;font-size:13.5px;letter-spacing:-.02em;line-height:1.1}
.logo small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.grow{flex:1}
#entBtn,#demoBtn{
  height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;
  padding:0 10px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;
}
#entBtn em,#demoBtn{font-style:normal}
.count{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#172033;color:#fff;font-family:"JetBrains Mono",monospace;font-size:10px;display:inline-grid;place-items:center}
.count.zero{background:#e8eef5;color:#5c6b7c}
#search{position:relative;flex:1;max-width:460px}
#q{width:100%;height:34px;border-radius:10px;border:1px solid var(--line);background:#f6f8fb;padding:0 12px 0 32px;outline:none;font-size:13px}
#q:focus{background:#fff;border-color:#c9d7f5;box-shadow:0 0 0 3px rgba(47,107,255,.12)}
#search .mag{position:absolute;left:10px;top:8px;color:#8aa;font-size:14px;pointer-events:none}
#askPop{
  position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 18px 50px rgba(23,32,51,.12);padding:8px;z-index:40;max-height:360px;overflow:auto
}
.hitrow,.chipbtn{display:flex;width:100%;text-align:left;gap:8px;border:0;background:transparent;border-radius:8px;padding:8px;align-items:flex-start}
.hitrow:hover,.chipbtn:hover{background:#f4f7fb}
.hitrow b{display:block;font-size:13px}
.hitrow span,.ans{display:block;color:var(--muted);font-size:12px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px}
.chipbtn{width:auto;border:1px solid var(--line);border-radius:99px;padding:5px 8px;font-size:12px;color:#345}
#roles{display:flex;background:#f3f6fa;border-radius:10px;padding:3px;gap:2px}
#roles button{border:0;background:transparent;height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
#roles button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(23,32,51,.08)}
.badge{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#6a5620;background:#fff6dd;border-radius:99px;padding:5px 8px;white-space:nowrap}
#demoMenu,#entMenu{
  position:absolute;top:46px;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 16px 40px rgba(23,32,51,.12);min-width:280px;padding:6px;z-index:40
}
#entWrap,#demoWrap{position:relative}
#entMenu{left:0;right:auto;min-width:260px}
#entMenu button,#demoMenu button{display:flex;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;gap:8px;align-items:center;font-weight:600;font-size:13px}
#entMenu button small,#demoMenu button small{display:block;font-weight:500;color:var(--muted);font-size:11px}
#entMenu button.on,#demoMenu button:hover,#entMenu button:hover{background:#f4f7fb}
#demoMenu button.on{background:#f4f7fb}

#nav{position:fixed;left:16px;top:74px;z-index:12;display:flex;align-items:center;gap:8px;max-width:calc(100vw - var(--ins) - 80px)}
#back{
  width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;
  box-shadow:0 4px 14px rgba(23,32,51,.06);font-size:16px
}
#crumbs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
#crumbs button{border:0;background:transparent;padding:0;font-weight:600;color:#3d4b5e}
#crumbs button:last-child{color:var(--ink)}
#crumbs i{font-style:normal;opacity:.5}

#overlay{position:fixed;inset:0;z-index:8;pointer-events:none}
.pin{
  position:absolute;width:22px;height:22px;margin:-26px 0 0 -11px;border:0;border-radius:5px;
  background:#14181f;color:#fff;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:560;
  display:grid;place-items:center;pointer-events:auto;
  box-shadow:0 8px 16px rgba(20,24,31,.28);
}
.pin:after{content:"";position:absolute;left:7px;bottom:-4px;width:8px;height:8px;background:inherit;transform:rotate(45deg);border-radius:1px}
.pin.crit{background:var(--crit)}
.pin.on{box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--blue), 0 8px 16px rgba(20,24,31,.28)}
.wlabel,.brandplate,.tilecap,.baylab,.node{pointer-events:none}
.wlabel{
  position:absolute;transform:translate(-50%,-115%);text-align:center;white-space:nowrap;
  background:rgba(255,255,255,.94);border:1px solid rgba(23,32,51,.06);border-radius:8px;
  padding:3px 8px 4px;font-size:12px;font-weight:680;letter-spacing:-.01em;color:#172033;
  box-shadow:0 8px 18px rgba(23,32,51,.08)
}
.brandplate{
  position:absolute;transform:translate(-50%,8px);display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.96);border:1px solid rgba(23,32,51,.06);border-radius:14px;
  padding:5px 12px 5px 5px;box-shadow:0 12px 28px rgba(23,32,51,.1);white-space:nowrap
}
.brandplate .mark{width:32px;height:32px;display:grid}
.brandplate .mark svg{width:32px;height:32px;display:block}
.brandplate b{display:block;font-size:13px;letter-spacing:-.02em;line-height:1.15}
.brandplate small{display:block;margin-top:1px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5c6b7c;font-weight:700;font-family:"JetBrains Mono",ui-monospace,monospace}
.tilecap{
  position:absolute;transform:translate(-50%,-8%);text-align:center;min-width:58px;
  background:rgba(255,255,255,.96);border:1px solid rgba(23,32,51,.05);border-radius:9px;
  padding:3px 7px 4px;box-shadow:0 8px 16px rgba(23,32,51,.08)
}
.tilecap b{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;font-weight:720;letter-spacing:-.02em}
.tilecap small{display:block;margin-top:1px;font-size:9px;letter-spacing:.04em;color:#5c6b7c;font-weight:650}
.tilecap.fail b,.tilecap.fail small{color:#9f1239}
.tilecap.held small{color:#3d4a5c}
.tilecap.ok small{color:#157443}
.baylab{
  position:absolute;transform:translate(0,8px);display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.96);border-radius:999px;padding:4px 10px 4px 6px;
  box-shadow:0 8px 18px rgba(23,32,51,.08);font-size:12px;font-weight:720;letter-spacing:-.01em
}
.baylab svg{width:14px;height:14px;display:block}
.blogo{width:28px;height:28px;flex:none;display:grid}
.blogo svg{width:28px;height:28px;display:block}
.brandhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:4px}
.brandhead>svg{width:42px;height:42px;flex:none}
.brandhead h2{margin:2px 0 4px}
.node{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #2f6bff, 0 0 0 5px rgba(47,107,255,.16)}
.fcard{
  position:absolute;width:300px;background:#fff;border-radius:16px;pointer-events:auto;
  box-shadow:0 18px 50px rgba(23,32,51,.16), 0 0 0 1px rgba(23,32,51,.05);
  padding:12px 12px 10px;
}
.fcard .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fcard h3{margin:8px 0 4px;font-size:15px;letter-spacing:-.02em;line-height:1.3;text-transform:none;color:var(--ink)}
.maplab{position:absolute;transform:translate(-50%,-115%);pointer-events:none;max-width:148px;background:rgba(255,255,255,.94);border:1px solid #e6ebf2;border-radius:10px;padding:5px 8px;box-shadow:0 8px 20px rgba(23,32,51,.08);text-align:left}
.maplab b{display:block;font-size:12.5px;letter-spacing:-.01em}
.maplab small{display:block;margin-top:1px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5c6b7c;font-weight:700}
.fcard p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.4}
.fcard .go{margin-top:10px;width:100%;height:32px;border:0;border-radius:9px;background:var(--ink);color:#fff;font-weight:650;font-size:12.5px}
.x{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:2px 4px}
.pop{
  position:absolute;width:220px;background:#fff;border-radius:14px;padding:10px;pointer-events:auto;
  box-shadow:0 14px 40px rgba(23,32,51,.16),0 0 0 1px rgba(23,32,51,.05)
}
.pop b{display:block;font-size:13px}
.pop span{display:block;color:var(--muted);font-size:12px;margin:3px 0 8px;line-height:1.35}
.pop button{height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0 10px;font-weight:650;font-size:12px}

#inspector{
  position:fixed;top:72px;right:14px;bottom:14px;width:var(--ins);z-index:16;
  background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(23,32,51,.1),0 0 0 1px rgba(23,32,51,.04);
  display:flex;flex-direction:column;overflow:hidden;
}
#catbar{
  flex:none;display:flex;gap:4px;align-items:center;padding:10px 12px 8px;
  border-bottom:1px solid #eef2f6
}
#catbar button{
  height:34px;border:0;background:transparent;color:#5c6b7c;border-radius:10px;
  display:inline-flex;align-items:center;gap:6px;padding:0 8px;font-weight:680;font-size:12px
}
#catbar button svg{width:16px;height:16px;display:block}
#catbar button.on{background:#172033;color:#fff}
#catbar button:hover{background:#f3f6fa}
#catbar button.on:hover{background:#172033}
body.ins-closed{--ins:16px}
body.ins-closed #inspector{transform:translateX(calc(100% + 20px))}
#insBody{overflow:auto;padding:14px 16px 22px;flex:1;min-height:0}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7b8796}
h2{margin:4px 0 6px;font-size:22px;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:12.5px;line-height:1.45;margin:0 0 8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kpi{background:#f5f7fb;border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:18px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#708092;font-weight:650}
h3{margin:16px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#708092}
.pcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e7eef5;border-radius:12px;padding:10px;margin:0 0 8px;box-shadow:0 1px 0 rgba(23,32,51,.03)}
.pcard.on{border-color:#b9ccff;box-shadow:0 0 0 3px rgba(47,107,255,.12)}
.pcard .t{font-weight:680;font-size:13.5px;letter-spacing:-.01em;line-height:1.35}
.pcard .s{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.35}
.row{display:flex;width:100%;text-align:left;gap:8px;border:0;background:transparent;padding:7px 2px;border-bottom:1px solid #f2f5f8;align-items:center}
.row b{display:block;font-size:13.5px}
.row span{display:block;color:var(--muted);font-size:12px}
.sq{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:750;flex:0 0 auto;background:#eef2f6;color:#556}
.sq.crit{background:#ffe8ea;color:var(--crit)}
.sq.warn{background:#fff1df;color:#a86412}
.sq.ok{background:#e9f7ef;color:var(--ok)}
.sq.prog{background:#e8efff;color:var(--blue)}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:99px;font-size:11px;font-weight:700;background:#eef2f6;color:#456}
.chip.crit{background:#ffe8ea;color:#b42334}
.chip.warn{background:#fff1df;color:#8a5a10}
.chip.prog,.chip.proposed{background:#e8efff;color:#1d4ed8}
.chip.ok,.chip.cleared{background:#e7f6ee;color:#157443}
.chip.failed{background:#ffece4;color:#c2410c}
.chip.restricted{background:#eef1f5;color:#3e4a5a}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:680;font-size:13px}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opt{display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:12px;margin:0 0 8px;align-items:flex-start}
.opt b{display:block;font-size:13px}
.opt span span{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.f{display:block;margin:10px 0 4px;font-size:12px;font-weight:700}
textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fbfcfe}
dl.sum{display:grid;grid-template-columns:110px 1fr;gap:6px 8px;font-size:13px;margin:10px 0}
dl.sum dt{color:var(--muted)}
table.grid{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 10px}
table.grid th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#708092;font-weight:700;padding:4px}
table.grid td{padding:5px 4px;border-top:1px solid #eef2f6}
.time{list-style:none;margin:0;padding:0}
.time li{position:relative;padding:0 0 10px 14px;font-size:12.5px}
.time li:before{content:"";position:absolute;left:0;top:6px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.time small{display:block;color:var(--muted)}
.rounds{display:flex;gap:10px;margin:12px 0}
.rounds button{width:74px;border:0;background:transparent;padding:0;font-size:11px;font-weight:650;color:#3d4b5e}
.rounds i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin:0 auto 4px;background:#f4f7fb;border:1px solid var(--line);font-style:normal;font-size:16px}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;margin:8px 0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 8px;font-size:13px}
.kv dt{color:var(--muted)}
.banner{background:#fff6f1;border:1px solid #ffd7c4;color:#9a3412;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.4;margin:8px 0}
.banner.ok{background:#f1faf4;border-color:#cdead7;color:#166534}
.banner.blue{background:#f3f6ff;border-color:#d5e1ff;color:#1e3a8a}
.mini{display:inline-flex;border:0;background:#f4f7fb;border-radius:99px;padding:3px 7px;margin:2px 4px 2px 0;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:650}
.mini.cleared{background:#e7f6ee;color:#157443}
.mini.confirmed,.mini.crit{background:#ffe8ea;color:#b42334}
.mini.failed{background:#ffece4;color:#c2410c}

#zoom button,#viewtog button,.sib{
  border:1px solid var(--line);background:#fff;box-shadow:0 4px 14px rgba(23,32,51,.05)
}
#zoom{position:fixed;z-index:14;right:calc(var(--ins) + 14px);bottom:16px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:36px;height:36px;border-radius:12px;font-size:16px}
#viewtog{position:fixed;z-index:14;left:16px;bottom:40px;display:flex;background:#fff;border-radius:12px;padding:3px;box-shadow:0 4px 14px rgba(23,32,51,.06);border:1px solid var(--line)}
#viewtog button{border:0;background:transparent;height:26px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);box-shadow:none}
#viewtog button.on{background:#172033;color:#fff}
#statusline{position:fixed;z-index:12;left:16px;bottom:14px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;color:#6d7c8d}
#siblings{position:fixed;z-index:12;left:150px;right:calc(var(--ins) + 70px);bottom:16px;display:flex;justify-content:center;gap:6px;pointer-events:none;flex-wrap:wrap}
.sib{pointer-events:auto;height:30px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:680}
.sib.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#toast{
  position:fixed;z-index:28;left:16px;right:calc(var(--ins) + 16px);top:118px;
  display:flex;justify-content:center;pointer-events:none
}
body.has-card #toast{top:304px;left:16px;right:auto;width:300px;justify-content:flex-start}
body.has-card #toast .box{max-width:300px}
#toast .box{pointer-events:auto;background:#172033;color:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;max-width:560px;box-shadow:0 12px 30px rgba(23,32,51,.25);font-size:13px}
#toast button{border:0;background:#fff;color:#172033;border-radius:8px;height:28px;padding:0 8px;font-weight:750;font-size:12px}
#tour{
  position:fixed;z-index:18;left:16px;right:calc(var(--ins) + 16px);bottom:58px;
  display:flex;justify-content:center;pointer-events:none
}
#tour .box{pointer-events:auto;width:min(640px,100%);background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 16px 40px rgba(23,32,51,.14),0 0 0 1px rgba(23,32,51,.05)}
#tour p{margin:4px 0 8px;font-size:14px;line-height:1.45}
#collapse{
  position:absolute;left:-14px;top:18px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  background:#fff;box-shadow:0 4px 12px rgba(23,32,51,.08);z-index:2
}
body.ins-closed #collapse{left:-44px}
@media (max-width:860px){
  :root{--top:104px}
  #top{flex-wrap:wrap;height:auto;padding:8px}
  #search{order:5;max-width:none;flex-basis:100%}
  #inspector{top:auto;left:0;right:0;bottom:0;width:100%;height:46vh;border-radius:16px 16px 0 0}
  body.ins-closed #inspector{transform:translateY(110%)}
  body.ins-closed{--ins:0px}
  .fcard,.brandplate,.wlabel{display:none}
  #viewtog,#statusline{display:none}
  #catbar{padding:8px 10px 6px;overflow:auto}
  #zoom{right:10px;bottom:calc(46vh + 14px)}
  #siblings{display:none}
  #nav{max-width:92vw}
  #toast,#tour{right:10px;left:10px;top:auto;bottom:calc(46vh + 64px)}
  .badge{display:none}
}
</style>
</head>
<body>
<header id="top">
  <button class="logo" data-act="home" title="Campus">

function project(x,y,z){
  z=z||0;
  if(S.plan) return [x*U*0.95, y*U*0.95];
  return [(x-y)*U*COS, (x+y)*U*SIN - z*U];
}
function planeMatrix(ox,oy,oz,ux,uy,uz,vx,vy,vz){
  const o=project(ox,oy,oz), u=project(ox+ux,oy+uy,oz+uz), v=project(ox+vx,oy+vy,oz+vz);
  return `matrix(${n2(u[0]-o[0])} ${n2(u[1]-o[1])} ${n2(v[0]-o[0])} ${n2(v[1]-o[1])} ${n2(o[0])} ${n2(o[1])})`;
}
function poly(pts){return pts.map((p,i)=>(i?'L':'M')+n2(p[0])+' '+n2(p[1])).join('')+'Z';}
function facesOf(b){
  const z=b.z||0,h=b.h||0,x=b.x,y=b.y,w=b.w,d=b.d;
  const A=project(x,y,z+h),B=project(x+w,y,z+h),C=project(x+w,y+d,z+h),D=project(x,y+d,z+h);
  const B0=project(x+w,y,z),C0=project(x+w,y+d,z),D0=project(x,y+d,z);
  return {top:poly([A,B,C,D]), left:h>0.02?poly([D,C,C0,D0]):'', right:h>0.02?poly([B,C,C0,B0]):''};
}
function linePath(pts){

function layoutBay(assets){
  const n=Math.max(assets.length,1);
  const cols=Math.min(GEO.maxCols,n), rows=Math.ceil(assets.length/cols)||1;
  const pitchX=GEO.tile+GEO.tgap, pitchY=GEO.tile+GEO.caption;
  const w=GEO.bpad*2+cols*GEO.tile+(cols-1)*GEO.tgap;
  const d=GEO.bpad*2+GEO.strip+rows*GEO.tile+(rows-1)*GEO.caption;
  const tiles=assets.map((asset,i)=>{
    const c=i%cols, r=Math.floor(i/cols);
    return {asset,x:GEO.bpad+c*pitchX, y:GEO.bpad+GEO.strip+r*pitchY, w:GEO.tile, d:GEO.tile};
  });
  return {w,d,cols,rows,tiles};
}
function layoutBuilding(lob){
  const byCat={};
  CATS.forEach(c=>{byCat[c.id]=layoutBay(lob.assets.filter(a=>a.cat===c.id)); byCat[c.id].cat=c.id;});
  const placed=[]; let y=GEO.bpadOut, maxW=0;
  BAY_ROWS.forEach(row=>{
    let x=GEO.bpadOut, rowD=0;
    row.forEach(cat=>{
      const b=byCat[cat];
      placed.push({...b,x,y});
      x+=b.w+GEO.bayGap; rowD=Math.max(rowD,b.d);
    });
    maxW=Math.max(maxW,x-GEO.bayGap+GEO.bpadOut);
    y+=rowD+GEO.rowGap;
  });
  const d=y-GEO.rowGap+GEO.bpadOut;
  const h=1.15+Math.min(1.05,lob.vol*0.07);
  return {lob,w:maxW,d,h,bays:placed};
}
function packDistrict(brand, buildings, x, y){
  const n=buildings.length, cols=Math.min(2, Math.max(1,n));
  const colW=[], rowD=[];
  buildings.forEach((b,i)=>{
    const c=i%cols, r=Math.floor(i/cols);
    colW[c]=Math.max(colW[c]||0,b.w); rowD[r]=Math.max(rowD[r]||0,b.d);
  });
  buildings.forEach((b,i)=>{
    const c=i%cols, r=Math.floor(i/cols);
    let px=GEO.dpad; for(let k=0;k<c;k++) px+=colW[k]+GEO.aisle;
    let py=GEO.dpad; for(let k=0;k<r;k++) py+=rowD[k]+GEO.aisle;
    b.x=px; b.y=py;
  });
  const innerW=colW.reduce((s,w)=>s+w,0)+GEO.aisle*Math.max(0,cols-1);
  const innerD=rowD.reduce((s,w)=>s+w,0)+GEO.aisle*Math.max(0,rowD.length-1);
  return {brand,x,y,w:innerW+GEO.dpad*2, d:innerD+GEO.dpad*2+GEO.dlabel, buildings};
}
function ensureLayout(m){
  if(m.layout) return m.layout;
  let x=0, maxD=0; const districts=[];
  m.brands.forEach(br=>{
    const buildings=m.lobs.filter(l=>l.brandId===br.id).map(layoutBuilding);
    const d=packDistrict(br,buildings,x,0);
    districts.push(d); x+=d.w+GEO.road; maxD=Math.max(maxD,d.d);
  });
  districts.forEach(d=>d.buildings.forEach(b=>{
    b.ax=d.x+b.x; b.ay=d.y+b.y;
    b.bays.forEach(bay=>{
      bay.ax=b.ax+bay.x; bay.ay=b.ay+bay.y;
      bay.tiles.forEach(t=>{t.ax=bay.ax+t.x; t.ay=bay.ay+t.y;});
    });
  }));
  m.layout={districts, w:Math.max(0,x-GEO.road), d:maxD};
  return m.layout;
}
function findBuilding(m,lobId){
  for(const d of m.layout.districts){const b=d.buildings.find(b=>b.lob.id===lobId); if(b) return {d,b};}
  return null;
}

function styleOf(a,m){
  let failed=false, restricted=false, proposed=false, sev=null;
  m.issues.forEach(i=>{
    const inSet=i.assetIds.includes(a.id);
    const tgt=i.execTargets&&i.execTargets[a.id];
    if(tgt==='applied') restricted=true;
    if(tgt==='failed' && i.status!=='resolved') failed=true;
    if(i.status==='resolved') return;
    if(i.pendingApprove && inSet && i.status==='open') proposed=true;
    else if(inSet && i.status==='open' && !proposed) sev=i.sev==='crit'?'crit':(sev==='crit'?'crit':i.sev);
  });
  if(failed) return 'failed';
  if(restricted) return 'restricted';
  if(proposed) return 'proposed';
  if(sev==='crit'||sev==='warn') return sev;
  if(a.assessment==='harmful') return 'crit';
  if(a.assessment==='url_variable') return 'link';
  if(a.assessment==='unused_confirmed_harmful'||a.assessment==='policy'||a.assessment==='disputed') return 'warn';
  if(a.assessment==='revoked') return 'revoked';
  if(a.assessment==='unreachable') return 'idle';
  if(String(a.assessment||'').startsWith('cleared')||a.assessment==='safe') return 'cleared';
  if(a.activity==='idle') return 'idle';
  return 'ok';
}
function bayTone(m,lob,cat){
  const sts=lob.assets.filter(a=>a.cat===cat).map(a=>styleOf(a,m));
  for(const k of ['failed','crit','warn','proposed','restricted']) if(sts.includes(k)) return k;
  return 'ok';
}

}

function pushBox(layers, layer, b){layers[layer].push(b);}
function sortLayer(arr){
  const n=arr.length; if(n<2) return arr;
  const behind=Array.from({length:n},()=>[]), indeg=Array(n).fill(0);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(i!==j){
    const A=arr[i], B=arr[j];
    const aBack=(A.x+A.w<=B.x+1e-6)||(A.y+A.d<=B.y+1e-6);
    const bBack=(B.x+B.w<=A.x+1e-6)||(B.y+B.d<=A.y+1e-6);
    if(aBack&&!bBack){behind[i].push(j);indeg[j]++;}
  }
  const q=[]; indeg.forEach((d,i)=>{if(!d)q.push(i);});
  const out=[];
  while(q.length){
    q.sort((a,b)=>(arr[a].x+arr[a].y)-(arr[b].x+arr[b].y));
    const i=q.shift(); out.push(arr[i]);
    behind[i].forEach(j=>{if(--indeg[j]===0) q.push(j);});
  }
  if(out.length<n) return arr.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  return out;
}
function boxSVG(b){
  const f=facesOf(b);
  const hit=b.hit?` data-hit="${b.hit}"`:'';
  const pe=b.hit?'':' pointer-events="none"';
  const op=b.op==null?1:b.op;
  if(op<0.03) return '';
  const g=`<g opacity="${op}"${pe}>`;
  const fill=b.hatch?'url(#hatch)':b.fill[0];
  const stroke=b.stroke||b.fill[3];
  const dash=b.dash?' stroke-dasharray="5 4"':'';
  if(S.plan) return `${g}<polygon class="face" points="${f.top.replace(/[MLZ]/g,'').trim()}" fill="${fill}" stroke="${stroke}"${dash}${hit}/></g>`.replace('points="','points="').replace(/(\d+\.?\d*) (\d+\.?\d*)/g,'$1,$2 ');
  /* plan path above is awkward — handle plan cleanly */
  return '';
}
function facePoints(path){
  const nums=path.match(/-?\d+\.?\d*/g)||[];
  const pts=[];
  for(let i=0;i<nums.length;i+=2) pts.push(nums[i]+','+nums[i+1]);
  return pts.join(' ');
}
function shadowOf(b){
  if((b.h||0)<0.1) return '';
  const pts=[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.d],[b.x,b.y+b.d]]
    .map(([x,y])=>project(x+0.18,y+0.22,0.03));
  return `<polygon class="shade" points="${pts.map(p=>n2(p[0])+','+n2(p[1])).join(' ')}"/>`;
}
function drawBox(b){
  const op=b.op==null?1:b.op;
  if(op<0.03) return '';
  const f=facesOf(b), hit=b.hit?` data-hit="${esc(b.hit)}"`:'', pe=b.hit?'':' pointer-events="none"';
  const fill=b.hatch?'url(#hatch)':b.fill[0];
  const stroke=b.stroke||(b.dash?'#2f6bff':'');
  const sw=stroke?(b.sw||1.6):0;
  const edge=stroke?` stroke="${stroke}" stroke-width="${sw}"`:'';
  const dash=b.dash?' stroke-dasharray="6 5"':'';
  const top=`<polygon class="face" points="${facePoints(f.top)}" fill="${fill}"${edge}${dash}${hit}/>`;
  if(S.plan||!f.left) return `<g opacity="${op}"${pe}>${top}</g>`;
  const side=(d,col)=>`<polygon class="face" points="${facePoints(d)}" fill="${col}"${hit}/>`;
  return `<g opacity="${op}"${pe}>${side(f.left,b.fill[1])}${side(f.right,b.fill[2])}${top}</g>`;
}

function gridSVG(x,y,w,d,step){
  let s='';
  for(let i=0;i<=w+0.01;i+=step){
    const a=project(x+i,y,0.02), b=project(x+i,y+d,0.02);
    s+=`<line class="grid" x1="${n2(a[0])}" y1="${n2(a[1])}" x2="${n2(b[0])}" y2="${n2(b[1])}"/>`;
  }
  for(let j=0;j<=d+0.01;j+=step){
    const a=project(x,y+j,0.02), b=project(x+w,y+j,0.02);
    s+=`<line class="grid" x1="${n2(a[0])}" y1="${n2(a[1])}" x2="${n2(b[0])}" y2="${n2(b[1])}"/>`;
  }
  return s;
}

  unders.forEach(u=>{svg+=u;});
  let shades='';
  for(let L=1;L<layers.length;L++) layers[L].forEach(b=>{if(b.op==null||b.op>0.35) shades+=shadowOf(b);});
  if(shades) svg+=`<g filter="url(#soft)">${shades}</g>`;
  for(let L=0;L<layers.length;L++) sortLayer(layers[L]).forEach(b=>{svg+=drawBox(b);});
  routes.forEach(pts=>{
    const d=linePath(pts);
    svg+=`<path class="route-glow" d="${d}"/><path class="route" d="${d}"/>`;
  });
  svg+=texts.join('');
  motions.forEach(mo=>{svg+=mo;});
  const boxes=layers.flat();
  const bounds=boundsOf(boxes, routes.flat());
  const card = S.concern&&S.level!=='map' ? cardAnchor(m, issueBy(S.concern)) : null;
  const pop = (S.asset&&(S.level==='lob'||S.level==='bay')) ? popAnchor(m,S.asset) : null;
  return {svg,pins,labels,nodes,bounds,card,pop,ground};
}
function sceneGround(){

function boundsOf(boxes, pts){
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  const add=(x,y)=>{if(!Number.isFinite(x))return; minx=Math.min(minx,x); miny=Math.min(miny,y); maxx=Math.max(maxx,x); maxy=Math.max(maxy,y);};
  boxes.forEach(b=>{
    [0,b.h||0].forEach(h=>{
      [[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.d],[b.x,b.y+b.d]].forEach(([x,y])=>{const p=project(x,y,(b.z||0)+h); add(p[0],p[1]);});
    });
  });
  (pts||[]).forEach(p=>{const q=project(p.x,p.y,p.z||0); add(q[0],q[1]);});
  if(!Number.isFinite(minx)) return {x:0,y:0,w:100,h:100};
  return {x:minx,y:miny,w:Math.max(20,maxx-minx),h:Math.max(20,maxy-miny)};
}

function addRoute(m,issue,routes,nodes){
  if(!issue) return;
  const loc=findBuilding(m,issue.lobId); if(!loc) return;
  const {d,b}=loc;
  const bay=b.bays.find(x=>x.cat===issue.cat)||b.bays[0];
  const open=(S.level==='lob'||S.level==='bay')&&S.lob===issue.lobId;
  const zR=open?0.72:b.h+0.42;
  const bayC={x:bay.ax+bay.w/2, y:bay.ay+bay.d*0.42, z:zR};
  let pts;
  if(open){
    const lipY=bay.ay+bay.d+0.55;
    pts=[{x:bay.ax-0.85, y:lipY, z:zR},{x:bay.ax+0.45, y:lipY, z:zR}];
  } else {
    const gate={x:d.x+Math.min(d.w*0.72, b.ax-d.x+b.w*0.5), y:d.y+d.d-0.35, z:0.28};
    const door={x:b.ax+b.w/2, y:b.ay+b.d+0.05, z:0.28};
    pts=[gate];
    if(Math.abs(gate.x-door.x)>0.3) pts.push({x:door.x,y:gate.y,z:0.28});
    pts.push(door);
    pts.push({x:door.x,y:b.ay+b.d-0.15, z:zR});
    if(Math.abs(door.x-bayC.x)>0.3) pts.push({x:bayC.x, y:b.ay+b.d-0.15, z:zR});
    pts.push(bayC);
  }
  const clean=[];
  pts.forEach(p=>{const l=clean[clean.length-1]; if(!l||Math.hypot(l.x-p.x,l.y-p.y,l.z-p.z)>0.08) clean.push(p);});
  routes.push(clean); clean.forEach(p=>nodes.push(p));
}
function cardAnchor(m,issue){
  const loc=findBuilding(m,issue.lobId); if(!loc) return null;
  const open=(S.level==='lob'||S.level==='bay')&&S.lob===issue.lobId;
  const bay=loc.b.bays.find(b=>b.cat===issue.cat)||loc.b.bays[0];
  if(open) return {x:bay.ax+bay.w*0.15, y:bay.ay, z:1.3};
  return {x:loc.b.ax+loc.b.w*0.7, y:loc.b.ay+loc.b.d*0.2, z:loc.b.h+1.1};

function popAnchor(m,id){

  return null;
}

function mapPanels(m,a){

  bits.push({kind:'lob',ref:lob.id,kicker:'Line of business',title:lob.name,line1:lob.code,line2:lob.brand.name});
  if(a.mapped) bits.push({kind:'note',ref:a.id,kicker:'Mapped LOB',title:a.mapped,line1:a.purpose||'Single mapping',line2:'No remap from this view'});
  if(issue) bits.push({kind:'concern',ref:issue.id,kicker:issue.type.toUpperCase(),title:IT[issue.type].label,line1:issue.sev==='crit'?'Critical':'Watch',line2:issue.execStatus==='partial'?'Partly applied 2 of 3':issue.status});
  const sib=lob.assets.filter(x=>x.cat===a.cat&&x.id!==a.id).slice(0,2);
  sib.forEach(s=>bits.push({kind:'asset',ref:s.id,kicker:'Same bay',title:s.name,line1:s.purpose||s.sub,line2:styleOf(s,m)}));
  if(a.cat==='tpl' && lob.id==='bank-sav') bits.push({kind:'asset',ref:'C-SAV-1',kicker:'Consent',title:'Savings consents',line1:'Preserved',line2:'Not invalidated by the mismatch'});
  const pos=[[0,9.2],[5.1,5.2],[-5.1,5.2],[5.3,1.15],[-5.3,1.15],[0,-2.7],[5.2,-2.7]];
  return bits.slice(0,7).map((p,i)=>({...p,x:pos[i][0],y:pos[i][1]}));
}
function mix(hex,amt){
  const n=parseInt(hex.slice(1),16), r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const m=c=>Math.round(c+(255-c)*amt);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}

/* ---------- camera ---------- */
function cardOn(){
  return !!(S.concern && (S.level==='ent'||S.level==='brand') && innerWidth>=1200);
}
function insets(){
  const ins=S.inspector&&innerWidth>860?400:0;
  const top=innerWidth>860?76:120;
  const bottom=innerWidth>860?78:(S.inspector?innerHeight*0.46+70:70);
  return {left:cardOn()?336:28, right:ins+78, top, bottom};
}
function fitCurrent(animate){
  if(!SCENE) return;
  const b=SCENE.bounds, pad=insets();
  const vw=Math.max(120, innerWidth-pad.left-pad.right), vh=Math.max(120, innerHeight-pad.top-pad.bottom);
  let s=Math.min(vw/b.w, vh/b.h);
  s=Math.max(0.18, Math.min(s, S.level==='map'?7:2.6));
  if(S.level==='bay'&&S.lob){
    const m=M(), loc=findBuilding(m,S.lob);
    const bay=loc&&loc.b.bays.find(x=>x.cat===S.cat);
    if(bay){
      const bb=boundsOf([{x:bay.ax-0.6,y:bay.ay-0.5,z:0,w:bay.w+1.4,d:bay.d+1.2,h:1.2}],[]);
      s=Math.min(vw/bb.w, vh/bb.h); s=Math.max(0.35,Math.min(s,16));
      const tx=pad.left+(vw-bb.w*s)/2 - bb.x*s;
      const ty=pad.top+(vh-bb.h*s)/2 - bb.y*s;
      animateCam(tx,ty,s,animate); return;
    }
  }
  const tx=pad.left+(vw-b.w*s)/2 - b.x*s;
  const ty=pad.top+(vh-b.h*s)/2 - b.y*s;
  animateCam(tx,ty,s,animate!==false);
}
function animateCam(tx,ty,s,animate){
  if(!animate||RM){cam.tx=tx;cam.ty=ty;cam.s=s;cam.anim=null;return;}
  cam.anim={fx:cam.tx,fy:cam.ty,fs:cam.s,tx,ty,ts:s,t0:performance.now(),dur:620};
}
function stepCam(){
  if(cam.anim){
    const a=cam.anim, t=Math.min(1,(performance.now()-a.t0)/a.dur), e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    cam.tx=a.fx+(a.tx-a.fx)*e; cam.ty=a.fy+(a.ty-a.fy)*e; cam.s=a.fs+(a.ts-a.fs)*e;
    if(t>=1) cam.anim=null;
  }
  const dw=wallTarget-wallK;
  if(Math.abs(dw)>0.004){wallK+=dw*(RM?1:0.16); return true;}
  if(wallK!==wallTarget){wallK=wallTarget; return true;}
  return false;
}
function screen(x,y,z){
  const p=project(x,y,z);
  return [p[0]*cam.s+cam.tx, p[1]*cam.s+cam.ty];
}

function separateLabels(){
  if(S.level!=='ent'&&S.level!=='brand') return;
  const root=$id('overlay');
  const labs=[...root.querySelectorAll('.wlabel,.brandplate')];
  const pins=[...root.querySelectorAll('.pin')];
  if(!labs.length) return;
  const box=el=>{const r=el.getBoundingClientRect();return {l:r.left,t:r.top,r:r.right,b:r.bottom,w:r.width};};
  const hit=(a,b)=>a.l<b.r-2 && a.r>b.l+2 && a.t<b.b+4 && a.b>b.t-4;
  const minL=cardOn()?332:12;
  const maxR=innerWidth-(S.inspector&&innerWidth>860?424:16);
  labs.forEach(el=>{
    const w=el.offsetWidth||box(el).w;
    let cx=parseFloat(el.style.left);
    if(cx-w/2<minL) cx=minL+w/2;
    if(cx+w/2>maxR) cx=maxR-w/2;
    el.style.left=cx+'px';
    el.dataset.nudge='0';
  });
  for(let n=0;n<12;n++){
    let moved=false;
    const pb=pins.map(box);
    for(const el of labs){
      if(+el.dataset.nudge>=8) continue;
      const a=box(el);
      const onPin=pb.some(b=>hit(a,b));
      const onW=el.classList.contains('brandplate') && labs.some(o=>o!==el && o.classList.contains('wlabel') && hit(a,box(o)));
      if(!onPin && !onW) continue;
      const dy=el.classList.contains('wlabel')?-6:6;
      el.style.top=(parseFloat(el.style.top)+dy)+'px';
      el.dataset.nudge=+el.dataset.nudge+1;
      moved=true;
    }
    if(!moved) break;
  }
}

function commitSheet(){
  readSheet();

      i.pendingApprove=true; i.proposedChoice=s.choice; i.proposedNote=s.note;

      render({fit:false}); return;
    }
    if(!i.pendingApprove){toast('An investigator must propose this first');return;}
    applyGated(i,s.choice,action); S.sheet=null; render({fit:false}); return;
  }
  if(s.choice==='policy'){
    i.status='prog'; i.execStatus='policy'; i.action={label:action[1],due:s.due,note:s.note};
    i.events.push({k:'policy',label:'Policy clarification required',detail:'No automatic cross-LOB revocation'});

  } else if(RECORD_ONLY.has(s.choice)){
    i.events.push({k:'record',label:'Recorded',detail:action[1]});

  } else {
    i.status='prog'; i.action={label:action[1],due:s.due,note:s.note};
    i.events.push({k:'sent',label:'Sent',detail:action[1]});

}
function applyGated(i,choice,action){
  i.pendingApprove=false; i.status='prog';
  i.action={label:action[1],note:i.proposedNote,simulated:true};
  if(choice==='restrict'){
    i.execStatus='partial';
    i.execTargets={T101:'applied',T204:'applied',T310:'failed'};
    i.events.push({k:'partial',label:'Partly applied',detail:'2 of 3 · T101 and T204 applied · T310 failed'});
    toast('Partly applied: 2 of 3 targets (simulated). T310 failed.');
  } else if(choice==='restrict2'){
    i.execStatus='applied'; i.execTargets={T501:'applied',T502:'applied',T503:'applied'};
    i.events.push({k:'applied',label:'Applied',detail:'T501, T502 and T503 restricted (simulated)'});
    toast('Simulated restriction applied to T501–T503');
  } else if(choice==='restricturl'){
    i.execStatus='applied'; i.execTargets={S601:'applied',S602:'applied'};
    i.events.push({k:'applied',label:'Applied',detail:'S601 and S602 restricted. Alias coverage is incomplete if the match is destination-only.'});
    toast('Simulated URL restriction queued for S601 and S602');
  } else {
    i.execStatus='applied'; i.execTargets=Object.fromEntries(i.assetIds.map(id=>[id,'applied']));
    i.events.push({k:'applied',label:'Applied',detail:action[1]+' (simulated)'});
    toast('Simulated action applied · '+action[1]);
  }
}
function retryIssue(id){
  const i=issueBy(id); if(!i||!i.execTargets) return;
  const failed=Object.keys(i.execTargets).filter(k=>i.execTargets[k]==='failed');
  failed.forEach(k=>{i.execTargets[k]='applied';});
  const vals=Object.values(i.execTargets), ok=vals.filter(v=>v==='applied').length;
  i.execStatus=vals.every(v=>v==='applied')?'applied':'partial';
  i.events.push({k:'retry',label:'Retry',detail:failed.join(', ')+' applied'});
  toast(failed.includes('T310')?`T310 applied on retry (simulated). ${ok} of ${vals.length} complete.`:`Retry complete (simulated). ${ok} of ${vals.length} applied.`);
  render({fit:false});
}

/* ---------- ask ---------- */
function ask(q){
  const t=q.trim(); if(!t) return;
  const m=M();
  const low=t.toLowerCase();
  let text='', acts=[];
  const go=i=>i?()=>focusConcern(i.id):null;
  if(/mismatch|mapped to savings|uc1|t101|loan-offer/.test(low)){
    text='UC1 content–LOB mismatch: T101, T204 and T310 contain loan offers while mapped to L-SAV. T400, T405 and T410 are cleared for this finding. Savings consents are preserved. There is no remap.';
    acts=[['Open UC1','issue:uc1']];
  } else if(/1100|exposure|recipients|observed/.test(low)){
    text='1,100 distinct observed recipients across T101 and T310 (900 + 300 − 100 overlap). Idle T204 contributes 0. This is observed exposure, not 1,100 invalid consents.';
  } else if(/cleared|t400|t410|exclud/.test(low)){
    text='Cleared for UC1: T400 and T405 fit Savings. T410 is a loan offer correctly mapped to L-LOAN. Cleared means not affected by this finding — not a certificate for every other issue.';
  } else if(/partly|did the action|t310|incomplete|execution/.test(low)){
    text='Demo C: after Approver confirms, simulated apply reports T101 and T204 applied, and T310 failed. That is partly applied, 2 of 3. Retry the failed target from the concern.';
    acts=[['Open UC1','issue:uc1']];
  } else if(/policy|uc4|revocation|financial offers|r200/.test(low)){
    text='UC4: R200 revoked Personal Loans. A later loan offer went out on T620, mapped to Financial Offers, where consent R200-FO is separately active. Default state: policy clarification required. No automatic cross-LOB revocation.';
    acts=[['Open UC4','issue:uc4']];
  } else if(/url|uc9|cta|loan-check|short\.example/.test(low)){
    text='UC9: S601 and S602 point at https://loan-check.example/verify in the fixture (fictional). S603 is a safe URL and is cleared. CTA-A through CTA-E are reviewed independently. CTA-E unreachable is neither safe nor harmful. No live fetches.';
    acts=[['Open UC9','issue:uc9']];
  } else if(/consent.*valid|savings consent|invalid consent|why are savings/.test(low)){
    text='A mapping defect does not invalidate valid Savings consents. The defect is the template–LOB association and whether the content fits that LOB.';
  } else if(/walk|tour|guide/.test(low)){
    text='Starting the UC1 walk-through.'; startTour();
  } else if(/first|priorit|should i|next step|act on/.test(low)){
    const i=openConcerns(m)[0];
    if(!i) text='Nothing open is waiting.';
    else {text=`Start with ${m.lob[i.lobId].brand.name} → ${m.lob[i.lobId].name}: ${IT[i.type].title(i.n)}. Suggested action: ${IT[i.type].actions[0][1]}.`; acts=[['Open it','issue:'+i.id]];}
  } else if(/uc2|guaranteed|deceptive/.test(low)){
    text='UC2: T501, T502 (idle) and T503 carry a deceptive “guaranteed approval” claim. T504 is an ordinary loan offer and is cleared for this finding.';
    acts=[['Open UC2','issue:uc2']];
  } else if(/uc3|disputed|c-3317/.test(low)){
    text='UC3: the Loans template mapping matches, and signup evidence for C-3317 is missing. Request the original consent evidence. Do not invent batch fraud.';
    acts=[['Open UC3','issue:uc3']];
  } else if(/uc6|variable|t602/.test(low)){
    text='UC6: T602 kept an approved structure. Populated values changed the purpose. Continue URL cases under UC9.';
    acts=[['Open UC6','issue:uc6']];
  } else {
    const hits=searchHits(low);
    if(hits[0]&&hits[0].act.startsWith('ask')) text=hits[0].sub;
    else if(hits.length){showSearch(low); return;}
    else text=`Nothing in ${m.ent.name} matches that. Try a template id (T101), a brand, or one of the sample questions.`;
  }
  $id('askPop').hidden=false;
  $id('askPop').innerHTML=`<div class="ans" style="padding:8px">${esc(text)}</div>`+(acts.length?`<div class="btns" style="padding:0 8px 8px">${acts.map(a=>`<button class="btn pri" data-act="${a[1]}">${esc(a[0])}</button>`).join('')}</div>`:'');
}
function searchHits(low){
  const m=M(), hits=[];
  m.issues.forEach(i=>{const title=IT[i.type].title(i.n); if((i.type+' '+title+' '+IT[i.type].label).toLowerCase().includes(low)) hits.push({t:title,sub:m.lob[i.lobId].name+' · '+i.type.toUpperCase(),act:'issue:'+i.id});});
  m.assets.forEach(a=>{if((a.name+' '+a.id+' '+(a.sub||'')).toLowerCase().includes(low)) hits.push({t:a.name,sub:m.lob[a.lobId].name+' · '+CATS.find(c=>c.id===a.cat).s,act:'goto:'+a.id});});
  m.lobs.forEach(l=>{if(l.name.toLowerCase().includes(low)||l.code.toLowerCase().includes(low)) hits.push({t:l.name,sub:l.brand.name+' · '+l.code,act:'lob:'+l.id});});
  m.brands.forEach(b=>{if(b.name.toLowerCase().includes(low)) hits.push({t:b.name,sub:'Brand',act:'brand:'+b.id});});
  return hits.slice(0,8);
}
function showSearch(low){
  const hits=low?searchHits(low):[];

  let html='';
  if(!low) html=`<div class="chips">${chips.map(c=>`<button class="chipbtn" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  else if(!hits.length) html=`<div class="ans" style="padding:8px">No records match. Ask a question or try T101, Savings, UC9.</div>`;
  else html=hits.map(h=>`<button class="hitrow" data-act="${h.act}"><div><b>${esc(h.t)}</b><span>${esc(h.sub)}</span></div></button>`).join('');
  const pop=$id('askPop'); pop.hidden=false; pop.innerHTML=html;
}

function doAct(act){
  if(!act) return;
  if(act==='home'){S.level='ent';S.brand=S.lob=S.cat=S.asset=S.concern=S.sheet=null;S.tour=null;render();return;}
  if(act==='up'){levelUp();return;}
  if(act==='collapse'){S.inspector=!S.inspector;render({fit:true});return;}
  if(act==='zin'){zoomAt(innerWidth/2,innerHeight/2,1.2);return;}
  if(act==='zout'){zoomAt(innerWidth/2,innerHeight/2,1/1.2);return;}
  if(act==='fit'){fitCurrent(true);return;}
  if(act==='view:iso'){S.plan=false;render();return;}
  if(act==='view:plan'){S.plan=true;render();return;}
  if(act==='toggle-demo'){$id('demoMenu').hidden=!$id('demoMenu').hidden;$id('entMenu').hidden=true;return;}
  if(act==='toggle-ent'){$id('entMenu').hidden=!$id('entMenu').hidden;$id('demoMenu').hidden=true;return;}
  if(act==='clear-concern'){S.concern=null;S.sheet=null;render({fit:false});return;}
  if(act==='zoom-concern'){if(S.concern) focusConcern(S.concern,{zoom:true});return;}
  if(act==='connections'){if(S.asset) goMap(S.asset);return;}
  if(act==='sheet-review'){readSheet(); if(S.sheet){S.sheet.step=1; render({fit:false});} return;}
  if(act==='sheet-edit'){if(S.sheet){S.sheet.step=0; render({fit:false});} return;}
  if(act==='sheet-cancel'){S.sheet=null; render({fit:false}); return;}
  if(act==='sheet-send'){commitSheet(); return;}
  if(act==='tour-next'){if(S.tour==null)return; if(S.tour>=TOUR.length-1){S.tour=null;render({fit:false});return;} S.tour++; applyTour(); render(); return;}
  if(act==='tour-prev'){if(S.tour>0){S.tour--; applyTour(); render();} return;}
  if(act==='tour-stop'){S.tour=null; render({fit:false}); return;}
  const [k,a,b]=act.split(':');
  if(k==='role'){setRole(a);return;}
  if(k==='ent'||act.startsWith('aster')||act==='northstar'||act==='orbit'){}
  if(k==='brand'){goBrand(a);return;}
  if(k==='lob'){goLob(a);return;}
  if(k==='bay'){goBay(a,b);return;}
  if(k==='cat'){if(S.lob) goBay(S.lob,a); else S.filter=a||null, render({fit:false}); return;}
  if(k==='issue'){focusConcern(a);return;}
  if(k==='pin'){const list=openConcerns(M(),a); if(!list.length){goLob(a);return;} const idx=list.findIndex(i=>i.id===S.concern); focusConcern(list[(idx+1)%list.length].id); return;}
  if(k==='act'){openSheet(a);return;}
  if(k==='goto'){gotoAsset(a);return;}
  if(k==='retry'){retryIssue(a);return;}
  if(k==='resolve'){resolveIssue(a);return;}
  if(k==='withdraw'){withdraw(a);return;}
  if(k==='arm'){openSheet(a);return;}
  if(k==='panel'){
    const kind=a, ref=act.split(':').slice(2).join(':');
    if(kind==='asset') goMap(ref);
    else if(kind==='lob') goLob(ref);
    else if(kind==='concern') focusConcern(ref,{zoom:true});
    return;
  }
}
function onHit(hit){
  if(!hit||hit==='bg'){clearSoft();return;}
  const [k,a,b]=hit.split(':');
  if(k==='brand'){goBrand(a);return;}
  if(k==='lob'){goLob(a);return;}
  if(k==='bay'){goBay(a,b);return;}
  if(k==='asset'){
    const now=performance.now();
    if(onHit._id===hit && now-onHit._t<320){onHit._t=0; goMap(a); return;}
    onHit._id=hit; onHit._t=now;
    S.asset=a; render({fit:false}); return;
  }
  if(k==='panel'){doAct('panel:'+a+':'+b);return;}
}
function clearSoft(){
  if(S.sheet){S.sheet=null; render({fit:false}); return;}
  if(S.asset && S.level!=='map'){S.asset=null; render({fit:false}); return;}
  if(S.concern){S.concern=null; render({fit:false}); return;}
}
function zoomAt(mx,my,f){
  const ns=Math.max(0.15, Math.min(6.5, cam.s*f));
  cam.tx=mx-(mx-cam.tx)*(ns/cam.s);
  cam.ty=my-(my-cam.ty)*(ns/cam.s);
  cam.s=ns; cam.anim=null;
}

/* ---------- input ---------- */
const stage=$id('stage');
let drag=null;
stage.addEventListener('pointerdown',e=>{
  if(e.button!=null && e.button!==0) return;
  drag={x:e.clientX,y:e.clientY,tx:cam.tx,ty:cam.ty,moved:false,hit:e.target.closest('[data-hit]')};
  stage.classList.add('dragging');
});
window.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(dx*dx+dy*dy>16){drag.moved=true; cam.tx=drag.tx+dx; cam.ty=drag.ty+dy; cam.anim=null;}
});
window.addEventListener('pointerup',e=>{
  if(!drag) return;
  const d=drag; drag=null; stage.classList.remove('dragging');
  if(d.moved) return;
  if(d.hit) onHit(d.hit.dataset.hit);
  else if(e.target===stage || e.target.id==='world') clearSoft();
});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(e.clientX,e.clientY, Math.exp(-e.deltaY*0.0011));
},{passive:false});
document.body.addEventListener('click',e=>{
  const chip=e.target.closest('[data-chip]');
  if(chip){$id('q').value=chip.dataset.chip; ask(chip.dataset.chip); return;}
  const ent=e.target.closest('[data-ent]');
  if(ent){S.ent=ent.dataset.ent; S.level='ent'; S.brand=S.lob=S.cat=S.asset=S.concern=S.sheet=null; $id('entMenu').hidden=true; render(); return;}
  const demoBtn=e.target.closest('[data-demo]');
  if(demoBtn){demo(demoBtn.dataset.demo); return;}
  const crumb=e.target.closest('[data-crumb]');
  if(crumb){const [k,a]=crumb.dataset.crumb.split(':');
    if(crumb.dataset.crumb==='ent') doAct('home');
    else if(k==='brand') goBrand(a);
    else if(k==='lob') goLob(a);
    else if(k==='cat') goBay(S.lob,a);
    return;}
  const filter=e.target.closest('[data-filter]');
  if(filter && filter.closest('#catbar')){S.filter=filter.dataset.filter||null; render({fit:false}); return;}
  const role=e.target.closest('[data-role]');
  if(role){setRole(role.dataset.role); return;}
  const actEl=e.target.closest('[data-act]');
  if(actEl){
    if(actEl.dataset.act==='zoom-concern' && actEl.dataset.issue){S.concern=actEl.dataset.issue;}
    doAct(actEl.dataset.act);
    if(!actEl.dataset.act.startsWith('toggle')){$id('demoMenu').hidden=true;$id('entMenu').hidden=true;}
    return;
  }
  if(!e.target.closest('#demoWrap')) $id('demoMenu').hidden=true;
  if(!e.target.closest('#entWrap')) $id('entMenu').hidden=true;
  if(!e.target.closest('#search')) $id('askPop').hidden=true;
});
$id('q').addEventListener('focus',()=>showSearch($id('q').value.trim().toLowerCase()));
$id('q').addEventListener('input',()=>{clearTimeout(askTimer); askTimer=setTimeout(()=>showSearch($id('q').value.trim().toLowerCase()),80);});
$id('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); ask($id('q').value);}});
window.addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'){if(e.key==='Escape') document.activeElement.blur(); return;}
  if(e.key==='/'){e.preventDefault(); $id('q').focus(); return;}
  if(e.key==='Escape'){
    if(!$id('demoMenu').hidden||!$id('entMenu').hidden||!$id('askPop').hidden){$id('demoMenu').hidden=$id('entMenu').hidden=$id('askPop').hidden=true;return;}
    if(S.tour!=null){S.tour=null;render({fit:false});return;}
    if(S.sheet){S.sheet=null;render({fit:false});return;}
    if(S.asset){S.asset=null;render({fit:false});return;}
    if(S.concern){S.concern=null;render({fit:false});return;}
    levelUp(); return;
  }
  if(e.key==='+'||e.key==='=') zoomAt(innerWidth/2,innerHeight/2,1.18);
  if(e.key==='-'||e.key==='_') zoomAt(innerWidth/2,innerHeight/2,1/1.18);
  if(e.key==='0') fitCurrent(true);
});
window.addEventListener('resize',()=>{if(SCENE) fitCurrent(false);});

function frame(){
  const dirty=stepCam();
  if(dirty){SCENE=buildScene(); const g=document.getElementById('world'); if(g) g.innerHTML=SCENE.svg;}
  placeWorld();
  positionOverlay();
  requestAnimationFrame(frame);
}
function boot(){
  getModel('aster'); getModel('northstar'); getModel('orbit');
  const m=getModel('aster');
  ['T101','T204','T310','T400','T405','T410','T501','T504','T620','T601','T602','S601','S603','CTA-E','C-3317','R200','R200-FO'].forEach(id=>{
    if(!m.asset[id]) console.error('missing asset', id);
  });
  if(m.issue.uc1.assetIds.join()!=='T101,T204,T310') console.error('uc1 targets');
  render();
  requestAnimationFrame(frame);
  window.CC={S, getModel, demo, focusConcern, setRole, resetSim, styleOf, counts, issueBy:()=>null};
  window.CC.issue=id=>getModel(S.ent).issue[id]||getModel('aster').issue[id];
  window.CC.asset=id=>getModel('aster').asset[id];
}
boot();
</script>
</body>
